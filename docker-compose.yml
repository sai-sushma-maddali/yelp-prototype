services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"

  user-api:
    build:
      context: ./backend
      dockerfile: ../services/user-api/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    depends_on:
      - kafka

  restaurant-api:
    build:
      context: ./backend
      dockerfile: ../services/restaurant-api/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - ./backend/.env
    depends_on:
      - kafka

  review-api:
    build:
      context: ./backend
      dockerfile: ../services/review-api/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - ./backend/.env
    depends_on:
      - kafka

  restaurant-owner-api:
    build:
      context: ./backend
      dockerfile: ../services/restaurant-owner-api/Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - ./backend/.env
    depends_on:
      - kafka