apiVersion: v1
kind: ConfigMap
metadata:
  name: yelp-app-config
  namespace: default
data:
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: yelp_db
  DB_USER: root
  DB_PASSWORD: root
  MONGO_URL: mongodb://mongo:27017
  MONGO_DB: yelp_db_mongo
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-api
  template:
    metadata:
      labels:
        app: user-api
    spec:
      containers:
      - name: user-api
        image: 177044824844.dkr.ecr.us-east-1.amazonaws.com/yelp/user-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: yelp-app-config
---
apiVersion: v1
kind: Service
metadata:
  name: user-api
  namespace: default
spec:
  selector:
    app: user-api
  ports:
  - port: 8001
    targetPort: 8001
---
