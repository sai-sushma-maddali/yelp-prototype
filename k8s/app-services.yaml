apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-api
  template:
    metadata:
      labels:
        app: review-api
    spec:
      containers:
      - name: review-api
        image: 177044824844.dkr.ecr.us-east-1.amazonaws.com/yelp/review-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
        envFrom:
        - configMapRef:
            name: yelp-app-config
        env:
        - name: SKIP_KAFKA_WORKERS
          value: "1"
---
